<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Terminal Rounded Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#080b12" stroke="url(#glowGrad)" stroke-width="2.5" />

  <!-- Code Monogram: < M / > -->
  <!-- Left Bracket < -->
  <path d="M18 24 L11 32 L18 40" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center 'M' -->
  <path d="M23 40 L23 25 L32 34 L41 25 L41 40" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)" />

  <!-- Right Bracket / > -->
  <path d="M46 40 L53 32 L46 24" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Terminal Dot Accent -->
  <circle cx="32" cy="47" r="1.5" fill="#10b981" />
</svg>

